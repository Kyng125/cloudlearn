# Render Blueprint: one web service serves both the API and the built front end.
# FREE PLAN: the filesystem is wiped on every restart, redeploy and spin-down (after ~15 idle minutes),
# so the database and uploads reset. See docs/DEPLOY.md before presenting.
services:
  - type: web
    name: cloudlearn
    runtime: node
    plan: free
    region: frankfurt            # closest Render region to Nigeria
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: EPHEMERAL_STORAGE      # shows the "demo hosting" notice in the app
        value: "1"
      - key: DB_FILE
        value: /tmp/cloudlearn/cloudlearn.db
      - key: UPLOAD_DIR
        value: /tmp/cloudlearn/uploads
      - key: BACKUP_DIR
        value: /tmp/cloudlearn/backups
      - key: ADMIN_EMAIL
        sync: false                 # you type it in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false                 # at least 10 characters; never commit it
      - key: BOOTSTRAP_DEMO         # 0 = start empty with just the admin; 1 = also create demo courses and users
        value: "0"
      - key: DEMO_PASSWORD          # only used when BOOTSTRAP_DEMO=1: password of the demo lecturers and students
        sync: false
